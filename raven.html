<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raven — Myl1Ssa.R8s | The Velvet Cabaret</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --red: #ff1a3c;
        --red-deep: #b30022;
        --gold: #d4af37;
        --marble: #14121a;
        --velvet: #1a1018;
        --cyan: #00f3ff;
        --text: #eae6e0;
        --text-muted: #9a958f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--marble); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    .header {
        position: fixed; top: 0; left: 0; right: 0; height: 70px;
        background: rgba(10,8,14,0.96); backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(212,175,55,0.25);
        display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 1000;
    }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; letter-spacing: 1px;
        background: linear-gradient(135deg, var(--gold), #f5e7b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    .nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 14px; transition: color 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }

    .page { padding: 120px 30px 60px; max-width: 1300px; margin: 0 auto; }
    .title { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 6vw, 64px); font-weight: 700; text-align: center;
        background: linear-gradient(135deg, var(--gold), #f5e7b2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { text-align: center; color: var(--text-muted); margin: 8px 0 8px; font-size: 16px; }
    .tag { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; margin-bottom: 48px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { border-radius: 10px; overflow: hidden; border: 1px solid rgba(212,175,55,0.25); background: #0a0810;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
    .card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 30px rgba(212,175,55,0.2); }
    .card video { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #000; }
    .card .meta { padding: 12px 14px; }
    .card .meta .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--gold); }
    .card .meta .who { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #fff; margin-top: 2px; }

    footer { text-align: center; padding: 50px 20px 40px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.08); }
    @media (max-width: 800px) { .nav-links { display: none; } }
</style>
</head>
<body>
<header class="header">
    <a href="index.html" class="logo">Tappy Lewis</a>
    <nav class="nav-links">
        <a href="index.html">Agent Verse</a>
        <a href="velvet-cabaret.html">Velvet Cabaret</a>
        <a href="velvet-cabaret-3d.html">3D Club</a>
        <a href="raven.html" class="active">Raven</a>
        <a href="nightclub.html">Snake Pit</a>
        <a href="game-room.html">Game Room</a>
        <a href="music/index.html">Music</a>
        <a href="club-decor.html">Decorations</a>
    </nav>
</header>

<div class="page">
    <div class="title">Raven</div>
    <div class="sub">Myl1Ssa.R8s — the glamorous one. Champagne, fur, and effortless elegance.</div>
    <div class="tag">Full reel · 21 clips</div>
    <div class="grid" id="grid"></div>
</div>

<footer>THE VELVET CABARET · Raven — every take, none lost.</footer>

<script>
    const count = 24; // filenames 01..24, skipping 02
    const skipped = new Set([2]);
    const grid = document.getElementById('grid');
    for (let i = 1; i <= count; i++) {
        if (skipped.has(i)) continue;
        const n = String(i).padStart(2, '0');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <video src="assets/characters/myl1ssa/myl1ssa-${n}.mp4" muted loop playsinline preload="metadata"></video>
            <div class="meta">
                <div class="n">RAVEN · ${n}</div>
                <div class="who">Myl1Ssa.R8s</div>
            </div>`;
        grid.appendChild(card);
    }
    // lazy autoplay: only play when in view (muted, lightweight)
    const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
            const v = e.target;
            if (e.isIntersecting) { v.play().catch(() => {}); }
            else { v.pause(); }
        });
    }, { rootMargin: '200px' });
    grid.querySelectorAll('video').forEach(v => io.observe(v));
</script>
</body>
</html>
